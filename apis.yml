x-domain-note: >-
  academi.com is still registered (Tucows, created 1999-08-04, expiry 2027-08-04) and
  delegated to AWS Route 53 with DNSSEC enabled, but it serves no website. Port 443 fails the
  TLS handshake outright (no certificate covering the hostname) and port 80 returns HTTP 409
  with a Cloudflare "error code: 1001" body on every path probed, including / , /robots.txt,
  /llms.txt, /openapi.json and every /.well-known/ path. The domain is retained for mail:
  Proofpoint MX records, an SPF record and a DMARC record with p=reject whose aggregate
  reports are addressed to itsec@constellis.com - first-party confirmation that the domain is
  administered by Constellis. No host is wired as an Academi Website pointer.
