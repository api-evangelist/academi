  server, A2A agent card, llms.txt, first-party SDK or registry package was found on any host
  this record knows. api., developer. and docs. under academi.com are all NXDOMAIN; npm
  returns 0 packages for academi/constellis and PyPI 404s; github.com/Academi is an empty
  shell organization created 2014-01-21 with 0 public repositories, no name, blog or email,
  and is not attributable to this company. Contract discovery (pipeline-enrich STEP 0b) ran
  every REST, GraphQL, MCP, OGC and agent-card probe against academi.com, www.academi.com and
  the successor host constellis.com and returned nothing.
