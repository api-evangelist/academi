aid: academi
name: Academi
description: >-
  ACADEMI was the 2011-2014 name of the American private military, security and training
  company founded on 26 December 1996 in North Carolina by Erik Prince and Al Clark as
  Blackwater. It was renamed Blackwater Worldwide in October 2007 after the Nisour Square
  shooting in Baghdad, then Xe Services LLC in February 2009. In December 2010 the training
  business and its Moyock, North Carolina campus - the largest private training facility in
  the United States - were bought by USTC Holdings, an investor consortium led by Forte
  Capital Advisors and Manhattan Strategic Ventures, ending Erik Prince's involvement, and
  the company was rebranded ACADEMI in December 2011 under chairman Red McCombs. In June 2014
  Academi Training Center, LLC was merged with Triple Canopy, Constellis Ltd., Strategic
  Social, Tidewater Global Services, National Strategic Protective Services and International
  Development Solutions to form Constellis Holdings, which Apollo Global Management acquired
  in September 2016 and which is headquartered in Herndon, Virginia. The ACADEMI brand was
  retired in the merger: Constellis states on its own site that "Academi remains part of
  historical, legal, and contractual records, but Constellis does not operate under the
  Academi name", and the Moyock campus now trades as the Constellis Training Center. The
  business sells physical services - firearms, driving, maritime, K-9, UAS/C-UAS and advanced
  security and military training, protective security details, and logistics and complex
  program management for United States government customers - not software. It never operated
  a developer program, public API, SDK, webhook surface or machine-readable API specification,
  and academi.com no longer serves a website: the domain is retained by Constellis for email
  only. This profile is retained as a historical record; there is no API surface to enrich.
